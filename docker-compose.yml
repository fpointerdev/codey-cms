name: codey-cms-export

services:
  backend:
    build:
      context: .
      target: development
    command: sh -c "pnpm install --frozen-lockfile && pnpm db:push && pnpm db:seed && pnpm dev"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-CodeY CMS}
      APP_MODE: ${APP_MODE:-cms}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:4000}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-codey}:${POSTGRES_PASSWORD:-codey}@postgres:5432/${POSTGRES_DB:-codey_site}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-replace-this-access-secret-32}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      CMS_CREDENTIAL_ENCRYPTION_KEY: ${CMS_CREDENTIAL_ENCRYPTION_KEY:-dev-only-replace-this-credential-key-32}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_ALLOW_REGISTRATION: ${AUTH_ALLOW_REGISTRATION:-false}
      AUTH_REQUIRE_EMAIL_VERIFICATION: ${AUTH_REQUIRE_EMAIL_VERIFICATION:-false}
      AUTH_RECOVERY_TOKEN_DELIVERY: ${AUTH_RECOVERY_TOKEN_DELIVERY:-response}
      CODEY_ADMIN_EMAIL: ${CODEY_ADMIN_EMAIL:-}
      CODEY_ADMIN_NAME: ${CODEY_ADMIN_NAME:-Owner}
      CODEY_ADMIN_PASSWORD: ${CODEY_ADMIN_PASSWORD:-}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-disabled}
      EMAIL_FROM: ${EMAIL_FROM:-orders@example.com}
      EMAIL_HTTP_ENDPOINT: ${EMAIL_HTTP_ENDPOINT:-}
      EMAIL_HTTP_BEARER_TOKEN: ${EMAIL_HTTP_BEARER_TOKEN:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: ${STORAGE_LOCAL_DIR:-storage/uploads}
      STORAGE_KEY_PREFIX: ${STORAGE_KEY_PREFIX:-sites/codey-cms}
      BACKUP_DIR: ${BACKUP_DIR:-backups}
      PORT: 4000
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
      - ./storage/uploads:/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codey_site}
      POSTGRES_USER: ${POSTGRES_USER:-codey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codey}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  backend_node_modules:
