<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <title>Code Epsylon</title>
    <meta name="description" content="Code Epsylon modular CMS and website foundation." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" data-brand>Code Epsylon</a>
      <button
        class="site-nav-toggle"
        type="button"
        aria-label="Toggle navigation"
        aria-controls="site-navigation"
        aria-expanded="false"
        data-site-nav-toggle
      >&#9776;</button>
      <nav id="site-navigation" class="site-nav" data-menu aria-label="Primary navigation"></nav>
    </header>

    <main class="page-shell">
      <div class="page-status" data-status></div>
      <article data-page></article>
    </main>

    <footer class="site-footer" data-footer></footer>

    <script type="module" src="./app.js"></script>
  </body>
</html>
