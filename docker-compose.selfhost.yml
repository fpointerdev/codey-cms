name: codey-cms-selfhost

x-codey-image: &codey-image
  image: codey-cms-selfhost:${CODEY_CMS_IMAGE_TAG:-local}
  build:
    context: .
    target: production

x-runtime-environment: &runtime-environment
  NODE_ENV: production
  APP_ENV: ${APP_ENV:-production}
  SELF_HOSTED: "true"
  CODEY_ALLOW_LOCAL_SETUP_HTTP: ${CODEY_ALLOW_LOCAL_SETUP_HTTP:-true}
  APP_NAME: ${APP_NAME:-CodeY CMS}
  APP_MODE: ${APP_MODE:-cms}
  APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:4000}
  API_PREFIX: /api/v1
  TRUST_PROXY: ${TRUST_PROXY:-false}
  SECURITY_AUDIT_KEY: ${SECURITY_AUDIT_KEY:-}
  SECURITY_AUDIT_PREVIOUS_KEYS: ${SECURITY_AUDIT_PREVIOUS_KEYS:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4000}
  POSTGRES_HOST: postgres
  POSTGRES_DB: codey_site
  POSTGRES_USER: codey
  STORAGE_DRIVER: local
  STORAGE_LOCAL_DIR: /app/storage/uploads
  STORAGE_KEY_PREFIX: sites/self-hosted
  AUTH_ALLOW_REGISTRATION: "false"
  AUTH_RECOVERY_TOKEN_DELIVERY: disabled
  CODEY_SEED_DEMO_CONTENT: ${CODEY_SEED_DEMO_CONTENT:-false}
  BACKUP_DIR: /app/backups
  BACKUP_MIRROR_DIR: /app/backups-mirror
  BACKUP_REQUIRE_ENCRYPTION: "true"
  BACKUP_REQUIRED: ${BACKUP_REQUIRED:-true}
  BACKUP_OFFSITE_REQUIRED: ${BACKUP_OFFSITE_REQUIRED:-true}
  BACKUP_OFFSITE_PROTECTED: ${BACKUP_OFFSITE_PROTECTED:-false}
  CODEY_UPDATES_ENABLED: "true"
  CODEY_AUTO_UPDATE: ${CODEY_AUTO_UPDATE:-true}
  CODEY_RELEASE_FEED_URL: ${CODEY_RELEASE_FEED_URL:-https://github.com/fpointerdev/codey-cms/releases/latest/download/stable.json}
  CODEY_RELEASE_PUBLIC_KEY_FILE: runtime-meta/release-public-key.pem
  CODEY_UPDATE_DIR: /runtime/updates
  CODEY_UPDATE_CONTROL_FILE: /runtime/control/pending-update.json
  CODEY_RUNTIME_ROOT: /runtime
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  secrets:
    <<: *codey-image
    user: "0:0"
    command: ["node", "scripts/init-selfhost-secrets.mjs"]
    environment:
      CODEY_SECRET_DIR: /run/codey-secrets
    volumes:
      - codey_secrets:/run/codey-secrets
    restart: "no"

  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    command:
      - postgres
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_statement=mod
      - -c
      - log_parameter_max_length=0
    environment:
      POSTGRES_DB: codey_site
      POSTGRES_USER: codey
      POSTGRES_PASSWORD_FILE: /run/codey-secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - codey_secrets:/run/codey-secrets:ro
    depends_on:
      secrets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codey -d codey_site"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 25m
        max-file: "5"

  backend:
    <<: *codey-image
    command: ["node", "scripts/selfhost-supervisor.mjs"]
    environment:
      <<: *runtime-environment
      CODEY_SECRET_DIR: /run/codey-secrets
    volumes:
      - codey_secrets:/run/codey-secrets:ro
      - codey_uploads:/app/storage/uploads
      - codey_backups:/app/backups
      - codey_backup_mirror:/app/backups-mirror
      - codey_runtime:/runtime
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      secrets:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

  backup:
    <<: *codey-image
    command: ["node", "scripts/run-with-runtime-secrets.mjs", "--", "node", "scripts/backup-scheduler.mjs"]
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3
    environment:
      <<: *runtime-environment
      CODEY_SECRET_DIR: /run/codey-secrets
    volumes:
      - codey_secrets:/run/codey-secrets:ro
      - codey_uploads:/app/storage/uploads:ro
      - codey_backups:/app/backups
      - codey_backup_mirror:/app/backups-mirror
    depends_on:
      secrets:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m

volumes:
  postgres_data:
  codey_secrets:
  codey_uploads:
  codey_backups:
  codey_backup_mirror:
  codey_runtime:
