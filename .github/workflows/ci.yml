name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-launchers:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: node scripts/validate-platform-launcher.mjs

  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: codey_cms_test
          POSTGRES_USER: codey
          POSTGRES_PASSWORD: codey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codey -d codey_cms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      APP_ENV: development
      APP_NAME: CodeY CMS Test
      APP_MODE: cms
      APP_PUBLIC_URL: http://127.0.0.1:4173
      DATABASE_URL: postgresql://codey:codey@127.0.0.1:5432/codey_cms_test?schema=public
      TEST_DATABASE_URL: postgresql://codey:codey@127.0.0.1:5432/codey_cms_test?schema=public
      MIGRATION_SHADOW_DATABASE_URL: postgresql://codey:codey@127.0.0.1:5432/codey_cms_shadow?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-with-at-least-32-characters
      CMS_CREDENTIAL_ENCRYPTION_KEY: ci-credential-key-with-at-least-32-characters
      CORS_ORIGINS: http://127.0.0.1:4173
      AUTH_RECOVERY_TOKEN_DELIVERY: response
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /tmp/codey-cms-ci-uploads
      STORAGE_KEY_PREFIX: tests/codey-cms
      BACKUP_DIR: /tmp/codey-cms-ci-backups
      BACKUP_REQUIRED: "false"
      LOG_LEVEL: silent

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.3.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Create migration shadow database
        env:
          PGPASSWORD: codey
        run: psql -h 127.0.0.1 -U codey -d postgres -c 'CREATE DATABASE codey_cms_shadow;'
      - run: pnpm run validate
      - run: pnpm run audit
      - name: First-run installation test
        run: pnpm run test:installation
      - name: Integration tests
        env:
          INTEGRATION_RESET_DATABASE: "true"
        run: pnpm run test:integration
      - name: Encrypted backup and restore test
        run: pnpm run test:recovery
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm run test:e2e
      - name: Public SEO and Lighthouse gates
        run: pnpm run audit:quality
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics
          path: |
            playwright-report
            test-results
            .lighthouseci
          if-no-files-found: ignore

  package-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.3.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build local qualification package
        env:
          CODEY_RELEASE_ALLOW_UNSIGNED: "true"
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          pnpm run release:build -- --allow-unsigned
      - name: Qualify extracted package with Docker
        env:
          CODEY_RELEASE_ALLOW_UNSIGNED: "true"
        run: pnpm run release:qualify -- --report=.release/qualification-report.json
      - name: Upload qualification diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-qualification
          path: |
            .release/qualification-report.json
            .release/qualification-diagnostics.log
          if-no-files-found: ignore

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-checks, platform-launchers, package-qualification]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      CODEY_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.3.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Verify release metadata and signing key
        env:
          CODEY_RELEASE_PRIVATE_KEY: ${{ secrets.CODEY_RELEASE_PRIVATE_KEY }}
        run: pnpm run release:preflight
      - name: Build signed release
        env:
          CODEY_RELEASE_PRIVATE_KEY: ${{ secrets.CODEY_RELEASE_PRIVATE_KEY }}
        run: pnpm run release:build
      - run: pnpm run release:verify
      - name: Qualify downloadable self-host package
        run: pnpm run release:qualify
      - name: Qualify previous-stable update and rollback
        run: pnpm run release:qualify-upgrade
      - name: Publish immutable runtime release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          .release/*
          --verify-tag
          --latest
          --title "CodeY CMS ${GITHUB_REF_NAME}"
          --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
