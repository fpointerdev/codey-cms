name: Publish MCP

on:
  push:
    tags:
      - "mcp-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: mcp-release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - name: Verify tag and package version
        run: |
          package_version="$(node -p "require('./integrations/codey-cms-mcp/package.json').version")"
          test "${GITHUB_REF_NAME}" = "mcp-v${package_version}"
      - run: pnpm run mcp:test
      - run: pnpm run mcp:build
      - name: Publish npm package with provenance
        run: npm publish integrations/codey-cms-mcp --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Install pinned MCP publisher
        run: |
          curl --fail --location --silent --show-error \
            --output mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Publish official MCP Registry metadata
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish integrations/codey-cms-mcp/server.json
      - name: Verify official registry record
        run: |
          curl --fail --silent --show-error \
            "https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.fpointerdev/codey-cms" \
            | grep -F 'io.github.fpointerdev/codey-cms'
