name: codey-cms-selfhost

services:
  backend:
    environment:
      APP_PUBLIC_URL: https://${CODEY_DOMAIN:?Set CODEY_DOMAIN to the public hostname}
      CUSTOM_STOREFRONT_DIR: ${CUSTOM_STOREFRONT_DIR:-}
      CORS_ORIGINS: https://${CODEY_DOMAIN:?Set CODEY_DOMAIN to the public hostname}
      CODEY_ALLOW_LOCAL_SETUP_HTTP: "false"
      TRUST_PROXY: "1"

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    environment:
      CODEY_DOMAIN: ${CODEY_DOMAIN:?Set CODEY_DOMAIN to the public hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    logging:
      driver: json-file
      options:
        max-size: 25m
        max-file: "5"

volumes:
  caddy_data:
  caddy_config:
