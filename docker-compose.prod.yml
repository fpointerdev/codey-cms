name: codey-cms

services:
  backend:
    build:
      context: .
      target: production
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-production}
      APP_NAME: ${APP_NAME}
      APP_MODE: ${APP_MODE}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      CORS_ORIGINS: ${CORS_ORIGINS}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_ALLOW_REGISTRATION: ${AUTH_ALLOW_REGISTRATION:-false}
      AUTH_REQUIRE_EMAIL_VERIFICATION: ${AUTH_REQUIRE_EMAIL_VERIFICATION:-false}
      AUTH_RECOVERY_TOKEN_DELIVERY: ${AUTH_RECOVERY_TOKEN_DELIVERY:-disabled}
      CODEY_ADMIN_EMAIL: ${CODEY_ADMIN_EMAIL:-}
      CODEY_ADMIN_NAME: ${CODEY_ADMIN_NAME:-Owner}
      CODEY_ADMIN_PASSWORD: ${CODEY_ADMIN_PASSWORD:-}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-disabled}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_HTTP_ENDPOINT: ${EMAIL_HTTP_ENDPOINT:-}
      EMAIL_HTTP_BEARER_TOKEN: ${EMAIL_HTTP_BEARER_TOKEN:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-auto}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
      STORAGE_S3_FORCE_PATH_STYLE: ${STORAGE_S3_FORCE_PATH_STYLE:-true}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}
      STORAGE_KEY_PREFIX: ${STORAGE_KEY_PREFIX}
      BACKUP_DIR: ${BACKUP_DIR:-backups}
      PORT: 4000
    volumes:
      - codey_backups:/app/backups
      - codey_uploads:/app/storage/uploads
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  codey_backups:
  codey_uploads:
